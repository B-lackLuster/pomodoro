name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        shell: pwsh
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build windows --release

      - name: Package (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "番茄时钟-Windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pomodoro-windows-x64
          path: 番茄时钟-Windows-x64.zip

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 番茄时钟-Windows-x64.zip
